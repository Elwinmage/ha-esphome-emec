# Example ESPHome configuration for an EMEC WDPHRH pH / Redox pool controller.
#
# It pulls the "emec" external component straight from GitHub, so you only
# need this file (no manual copy of the component). Adapt the board, pins,
# network and secrets to your setup. Every entity below is optional: remove
# the ones you do not want.

esphome:
  name: emec-piscine
  friendly_name: EMEC pool controller

# --- Any ESP32 works. ---
esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO           # set to DEBUG to see the periodic bus diagnostic line

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:                    # or use `ethernet:` instead
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Only needed by the "Sync clock" button.
time:
  - platform: homeassistant
    id: ha_time

# --- Pull the component from GitHub ---
external_components:
  - source:
      type: git
      url: https://github.com/Elwinmage/ha-esphome-emec
      ref: main
    components: [emec]

# --- RS485 UART ---
# The WDPHRH talks 38400 8N1 and needs its OWN bus (never share it with Modbus
# devices). The EMEC BT ETH gateway can stay connected.
# Use an AUTO-DIRECTION transceiver (MAX13487E, or any module with only
# VCC/TXD/RXD/GND and no DE pin): then NO flow_control_pin is needed.
# Power the module from 3.3V so its RO output stays 3.3V-safe for the ESP.
uart:
  id: rs485
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 38400
  rx_buffer_size: 512

# --- The controller hub ---
emec:
  id: wdphrh
  uart_id: rs485
  address: 1               # RS-485 slave address of the controller
  update_interval: 10s     # one full read cycle
  heartbeat_interval: 500ms

sensor:
  - platform: emec
    emec_id: wdphrh
    ph:
      name: "pH"
    redox:
      name: "Redox"
    service_hours:
      name: "Service counter"
    service_offset:
      name: "Service offset"

binary_sensor:
  - platform: emec
    emec_id: wdphrh
    connected:
      name: "Controller connected"
    alarm_ph_empty:
      name: "pH- reservoir empty"
    alarm_chlorine_empty:
      name: "Chlorine reservoir empty"
    alarm_no_flow:
      name: "No flow"
    standby:
      name: "Standby"
    output_1:
      name: "Output 1"
    output_2:
      name: "Output 2"
    output_3:
      name: "Output 3"
    dosing_alarm_ph_enabled:
      name: "Dosing alarm pH enabled"
    dosing_alarm_redox_enabled:
      name: "Dosing alarm Redox enabled"
    probe_failure_ph_enabled:
      name: "Probe failure pH enabled"
    probe_failure_redox_enabled:
      name: "Probe failure Redox enabled"

number:
  - platform: emec
    emec_id: wdphrh
    ph_high_setpoint:
      name: "pH high setpoint"
    ph_low_setpoint:
      name: "pH low setpoint"
    ph_high_dose:
      name: "pH high dose %"
    ph_low_dose:
      name: "pH low dose %"
    ph_waiting_time:
      name: "pH waiting time"
    redox_low_setpoint:
      name: "Redox low setpoint"
    redox_high_setpoint:
      name: "Redox high setpoint"
    redox_low_dose:
      name: "Redox low dose %"
    redox_high_dose:
      name: "Redox high dose %"
    redox_waiting_time:
      name: "Redox waiting time"
    max_strokes_ph:
      name: "Max strokes pH"
    max_strokes_redox:
      name: "Max strokes Redox"
    passcode:
      name: "Passcode"
    feeding_delay:
      name: "Feeding delay"
    dosing_alarm_ph_threshold:
      name: "Dosing alarm pH threshold"
    dosing_alarm_redox_threshold:
      name: "Dosing alarm Redox threshold"
    probe_failure_ph_threshold:
      name: "Probe failure pH threshold"
    probe_failure_redox_threshold:
      name: "Probe failure Redox threshold"
    flow_time:
      name: "Flow time"

select:
  - platform: emec
    emec_id: wdphrh
    ph_working_mode:
      name: "pH working mode"
    redox_working_mode:
      name: "Redox working mode"
    priority_mode:
      name: "Priority mode"
    flow_mode:
      name: "Flow mode"
    probe_failure_ph_mode:
      name: "Probe failure pH mode"
    probe_failure_redox_mode:
      name: "Probe failure Redox mode"
    dosing_alarm_ph_mode:
      name: "Dosing alarm pH mode"
    dosing_alarm_redox_mode:
      name: "Dosing alarm Redox mode"

switch:
  - platform: emec
    emec_id: wdphrh
    standby_input_nc:
      name: "DI Standby is N.C."
    ph_level_input_nc:
      name: "DI pH level is N.C."
    redox_level_input_nc:
      name: "DI Redox level is N.C."

button:
  - platform: emec
    emec_id: wdphrh
    reset_alarms:
      name: "Reset alarms"
    sync_clock:
      name: "Sync clock"
      time_id: ha_time
